[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zorkburr*"]

[project]
name = "zorkburr"
version = "0.1.0"
description = "Zork I AI player built on Apache Burr"
requires-python = ">=3.11"
dependencies = [
    "burr[start]>=0.39.0",
    "starlette>=0.37.0,<1.0.0",
    "fastapi>=0.112.0,<0.116.0",
    "jericho>=3.3.0",
    "instructor>=1.7.0",
    "openai>=1.79.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.0.0",
    "langfuse>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]
s3 = ["boto3>=1.34.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.zorkburr]
max_turns_per_episode = 1000
turn_delay_seconds = 0.0
use_local_models = true
local_model = "models/mistralai_Ministral-3-14B-Reasoning-2512-Q4_K_M.gguf"
llama_server_path = "llama-server"
context_size = 32768
n_gpu_layers = -1
n_parallel = 1
local_base_url = "http://localhost:8887/v1"
agent_model = "remote/anthropic/claude-sonnet-4.6"
critic_model = "mistralai/ministral-3-14b-reasoning"
extractor_model = "mistralai/ministral-3-14b-reasoning"
analysis_model = "mistralai/ministral-3-14b-reasoning"
knowledge_model = "remote/anthropic/claude-sonnet-4.6"
memory_model = "mistralai/ministral-3-14b-reasoning"
llm_request_timeout = 1200
llm_failure_circuit_breaker_threshold = 5
default_temperature = 1.0
default_max_tokens = 8192
enable_critic = true
critic_rejection_threshold = 0.3
max_rejections_per_turn = 3
enable_grounding_validator = true
objective_update_interval = 10
max_turns_stuck = 40
stuck_check_interval = 10
game_file = "roms/zork1.z5"
memory_file = "data/memories.json"
knowledge_file = "data/knowledge.md"
map_file = "data/map.json"

[tool.zorkburr.retry]
max_retries = 3
initial_delay = 1.0
max_delay = 30.0
